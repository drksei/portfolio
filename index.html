  <script>
    (function() {
      // Prevenir scroll del body en móviles
      document.addEventListener('touchmove', function(e) {
        // Permite scroll solo dentro del elemento #app
        if (!e.target.closest('#app')) {
          e.preventDefault();
        }
      }, { passive: false });
      
      // Prevenir gestos de zoom
      document.addEventListener('gesturestart', function(e) {
        e.preventDefault();
      });
    })();
  </script>
</head>
